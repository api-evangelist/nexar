  limit exceeded". The Live Feed, Work Zones and Road Inventory contracts do not declare a 429 at all. No RateLimit-*,
  X-RateLimit-* or Retry-After response header is declared in any of the four contracts, and no scope, window, quota
  or burst value is documented on the developer portal, in the llms.txt, or on nexar-ai.com. An agent therefore
  cannot tell how much budget it has, nor when to retry, until it is already being throttled. limit_count: 0 is
