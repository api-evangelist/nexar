openapi: 3.0.1
info:
  title: CityStream™ Work Zones API
  description: "The CityStream™ Work Zones API provides a curated collection of work zones that the Nexar's AI detects from images with road work elements (e.g. grabber cones, diamond signs, barriers or message boards).
    \n\n
    Before you start developing with the CityStream™ Work Zones API, make sure you have a valid Access Token."
  contact:
    name: Nexar
    url: https://getnexar.com/
    email: api-support@getnexar.com
  license:
    name: "License: Proprietary"
  version: "3.0"
servers:
  - url: https://external.getnexar.com
paths:
  /api/workzones/v3/detections:
    post:
      tags:
        - "Get a collection of work zones"
      summary: Get a set of curated work zone detections.
      description: Get curated work zone detections by element and road type from a geographical area defined as bounding box or H3 IDs (Hexagonal Hierarchical Spatial Index).
      operationId: NexarPlatformAPI_FindDetections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nexarFindDetectionsRequestParams'
        required: true
      responses:
        200:
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nexarFindDetectionsResponse'
        403:
          description: There's a problem with your request Authorization (Insufficient
            permissions)
          content:
            application/json:
              schema:
                type: object
        500:
          description: Something is broken. This is usually a temporary error due
            to high server load or a brief endpoint error.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      security:
        - Bearer: []
      x-codegen-request-body-name: body
  /api/workzones/v3/detections/single:
    post:
      tags:
        - "Get a specific work zone"
      summary: Get further information for a specific work zone.
      description: Get a specific work zone based on a Nexar detection unique identifier.
      operationId: NexarPlatformAPI_GetDetection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nexarGetDetectionRequestParams'
        required: true
      responses:
        200:
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nexarGetDetectionResponse'
        403:
          description: There's problem with your request Authorization (Insufficient
            permissions)
          content:
            application/json:
              schema:
                type: object
        500:
          description: Something is broken. This is usually a temporary error due
            to high server load or a brief endpoint error.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      security:
        - Bearer: []
      x-codegen-request-body-name: body
components:
  schemas:
    FindDetectionsRequestParamsSortDirection:
      title: Sort order
      type: string
      default: NONE
      enum:
        - NONE
        - ASC
        - DESC
    GPSSignalGPSProducer:
      title: GPS signal source (Camera or external mount)
      type: string
      default: DEVICE
      enum:
        - DEVICE
        - CAMERA_MOUNT
    H3IndexFormatApiElementFormat:
      title: H3 index format
      type: string
      description: Whether h3 hexagon ids are given in decimal or hex format
      default: UNSET
      enum:
        - UNSET
        - LONG
        - HEX
    ParkingSpotFilterIsAllowed:
      type: string
      default: PARKING_ALLOWED_NOT_SET
      enum:
        - PARKING_ALLOWED_NOT_SET
        - PARKING_ALLOWED_TRUE
        - PARKING_ALLOWED_FALSE
    apiConstructionZoneApiElementSubType:
      title: Road Blockage Detections
      type: string
      description: Sub types of road blockage detections (or ANY to include the entire
        type)
      default: UNKNOWN
      enum:
        - UNKNOWN
        - ARROW_OR_MESSAGE_BOARD
        - BARRICADE
        - BARRIER
        - DIAMOND_SIGN
        - DRUM
        - GRABBER_CONE
        - RECTANGULAR_SIGN
        - TRAFFIC_CONE
        - ANY
    apiConstructionZoneDetectionApiElement:
      title: Construction Zone Detection
      required:
        - sub_type
      type: object
      properties:
        confidence:
          title: Confidence
          type: number
          description: A score between 0 and 1 depicting the accuracy of this detection
          format: float
        bounding_box:
          $ref: '#/components/schemas/apiPixelBoundingBoxApiElement'
        location:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        sub_type:
          $ref: '#/components/schemas/apiConstructionZoneApiElementSubType'
    apiDetectionEvidenceFrameApiElement:
      title: Camera Evidence Frame
      required:
        - image_id
        - image_url
      type: object
      properties:
        image_id:
          title: Image Id
          type: string
          description: Unique Nexar Id for this evidence frame
        image_url:
          title: Image URL
          type: string
          description: Url for retrieving the evidence frame for this detection
    apiDetectionFilterApiElement:
      title: Detection request filters
      type: object
      properties:
        detections_with_evidence:
          title: Detections with evidence
          type: boolean
          description: If true then only detections containing visual evidence will
            be included in the response
        detection_types:
          title: Detection types
          type: array
          description: Specific type of detections requested (like roadsigns or construction
            zones)
          items:
            $ref: '#/components/schemas/apiDetectionTypeApiElement'
        osm_road_types:
          title: Open Street Map road type
          type: array
          description: The osm road types to include in the response (like MOTORWAY
            or PRIMARY)
          items:
            $ref: '#/components/schemas/apiOsmRoadTypeApiElement'
        detection_status:
          title: Detection Status
          type: array
          description: Include detections only for certain statuses (like NEW or EXISTING)
          items:
            $ref: '#/components/schemas/apiDetectionStatusApiElementStatus'
    apiDetectionRequestParams:
      title: Realtime Detection request parameters
      required:
        - bounding_box
      type: object
      properties:
        bounding_box:
          $ref: '#/components/schemas/apiGeoBoundingBoxApiElement'
        filter:
          $ref: '#/components/schemas/apiDetectionFilterApiElement'
        detections_from_millis:
          title: Detections from millis
          type: integer
          description: Epoch time in the past from when detections should be returned
          format: uint64
        max_detections_per_h3:
          title: Max detections per h3
          type: integer
          description: Maximum number of detections to return for each res 12 h3 hexagon
            within the given bounding box
          format: int64
        h3_index_format:
          $ref: '#/components/schemas/H3IndexFormatApiElementFormat'
      example:
        bounding_box:
          north_east:
            latitude: 40.80059708181876
            longitude: -73.92470436457806
          south_west:
            latitude: 40.79059708181876
            longitude: -74.02470436457806
        filter:
          detections_with_evidence: true
          detection_types:
            - traffic_sign: TURN_LEFT
            - traffic_sign: STOP
            - construction_zone: ANY
          osm_road_types:
            - FREEWAY
            - MOTORWAY
          detection_status:
            - EXISTING
        h3_index_format: HEX
        detection_from_millis: 1663591145110
        max_detections_per_h3: 100
    apiDetectionResponsePayload:
      title: Response for realtime detection requests
      type: object
      properties:
        detection_payload:
          $ref: '#/components/schemas/apiHexsegDetectionPayload'
        geo_json_payload:
          $ref: '#/components/schemas/apiGeoJsonDetectionCollection'
        wzdx_payload:
          $ref: '#/components/schemas/apiWZDxDetectionCollection'
    apiDetectionStatusApiElementStatus:
      type: string
      default: UNKNOWN
      enum:
        - UNKNOWN
        - NEW
        - EXISTING
        - REMOVED
    apiDetectionTypeApiElement:
      title: Detection Type
      oneOf:
        - type: object
          properties:
            traffic_sign:
              $ref: '#/components/schemas/apiTrafficSignApiElementSubType'
        - type: object
          properties:
            construction_zone_element:
              $ref: '#/components/schemas/apiConstructionZoneApiElementSubType'
        - type: object
          properties:
            road_blockage:
              $ref: '#/components/schemas/apiRoadBlockageApiElementSubType'
    apiGeoBoundingBoxApiElement:
      title: Geo Bounding Box
      required:
        - north_east
        - south_west
      type: object
      properties:
        north_east:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        south_west:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
    apiGeoJsonDetection:
      title: GeoJson Detection
      type: object
      properties:
        id:
          title: Id
          type: string
          description: Unique id for this detection
        type:
          $ref: '#/components/schemas/apiGeoJsonDetectionFeatureType'
        properties:
          $ref: '#/components/schemas/apiHexsegDetectionApiElement'
        geometry:
          $ref: '#/components/schemas/apiGeoJsonGeometryPoint'
    apiGeoJsonDetectionCollection:
      title: Detections GeoJson Collection
      required:
        - features
        - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/apiGeoJsonDetectionCollectionFeatureCollectionType'
        features:
          title: Nexar Detections represented as GeoJson Features
          type: array
          description: Nexar Detections represented as GeoJson Features
          items:
            $ref: '#/components/schemas/apiGeoJsonDetection'
      example:
        type: FeatureCollection
        features:
          - id: 323h983fh239aa8872s254
            type: Feature
            properties:
              detection_count: 14
              negative_detection_count: 2
              first_detection_millis: 1663401980387
              latest_detection_millis: 1663597804506
              construction_zone_elements:
                - confidence: 0.86949587
                  bounding_box:
                    x1: 664.625
                    y1: 382.92188
                    x2: 698.375
                    y2: 438.07812
                  location:
                    longitude: 40.681501
                    latitude: -73.9666176
                  sub_type: CONE
              camera_gps:
                latitude: 40.7380653
                longitude: -73.9800164
                course: 6.91280832
              frame:
                image_id: 4sf05555053d8412db18f81
                image_url: https://example.getnexar.com/c138656055/fod_4117-B25D.jpg
              osm_segment:
                source_id: string
                dest_id: string
                source_location:
                  latitude: 40.7380653
                  longitude: -73.9800164
                dest_location:
                  latitude: 40.7380653
                  longitude: -73.9800164
                type: MOTORWAY
              h3_indices:
                res_10: 622236723563233300
                res_12: 631243922817955300
              status: EXISTING
            geometry:
              type: Point
              coordinates:
                - -73.9800164
                - 40.7380653
    apiGeoJsonDetectionCollectionFeatureCollectionType:
      type: string
      default: UNSET
      enum:
        - UNSET
        - FeatureCollection
    apiGeoJsonDetectionFeatureType:
      type: string
      default: UNSET
      enum:
        - UNSET
        - Feature
    apiGeoJsonGeometryPoint:
      title: GeoJson Point
      type: object
      properties:
        type:
          $ref: '#/components/schemas/apiGeoJsonGeometryPointGeometryType'
        coordinates:
          title: Coordinates
          type: array
          description: A length 2 array containing the points longitude and latitude
          items:
            type: number
            format: double
    apiGeoJsonGeometryPointGeometryType:
      type: string
      default: UNSET
      enum:
        - UNSET
        - Point
    apiGeoLocationApiElement:
      title: Geo Coordinates
      required:
        - latitude
        - longitude
      type: object
      properties:
        longitude:
          title: Longitude
          type: number
          description: GPS Point longitude in decimal degrees
          format: double
        latitude:
          title: Latitude
          type: number
          description: GPS Point latitude in decimal degrees
          format: double
        course:
          title: Course
          type: number
          description: GPS Heading in degrees
          format: double
    apiH3IndicesApiElement:
      title: H3 Indices
      type: object
      properties:
        res_0:
          type: integer
          format: uint64
        res_1:
          type: integer
          format: uint64
        res_2:
          type: integer
          format: uint64
        res_3:
          type: integer
          format: uint64
        res_4:
          type: integer
          format: uint64
        res_5:
          type: integer
          format: uint64
        res_6:
          type: integer
          format: uint64
        res_7:
          type: integer
          format: uint64
        res_8:
          type: integer
          format: uint64
        res_9:
          type: integer
          format: uint64
        res_10:
          type: integer
          format: uint64
        res_11:
          type: integer
          format: uint64
        res_12:
          type: integer
          format: uint64
        res_13:
          type: integer
          format: uint64
        res_14:
          type: integer
          format: uint64
        res_15:
          type: integer
          format: uint64
        res_0_hex:
          type: string
        res_1_hex:
          type: string
        res_2_hex:
          type: string
        res_3_hex:
          type: string
        res_4_hex:
          type: string
        res_5_hex:
          type: string
        res_6_hex:
          type: string
        res_7_hex:
          type: string
        res_8_hex:
          type: string
        res_9_hex:
          type: string
        res_10_hex:
          type: string
        res_11_hex:
          type: string
        res_12_hex:
          type: string
        res_13_hex:
          type: string
        res_14_hex:
          type: string
        res_15_hex:
          type: string
    apiHexsegDetectionApiElement:
      title: Detection
      required:
        - detection_count
        - first_detection_millis
        - latest_detection_millis
      type: object
      properties:
        detection_count:
          title: Num confirmed detections
          type: integer
          description: The number of times this detection has been confirmed by different
            cameras frames
          format: int64
        negative_detection_count:
          title: Num Contradictory Detections
          type: integer
          description: The number of times this detection has been contradicted by
            different cameras frames
          format: int64
        first_detection_millis:
          title: First Detection Millis
          type: integer
          description: Timestamp when this detection was first recorded
          format: uint64
        latest_detection_millis:
          title: Latest Detection Millis
          type: integer
          description: Timestamp when this detection was most recently recorded
          format: uint64
        road_blockages:
          title: Road Blockage detection details
          type: array
          description: Nexar road blockage detection details
          items:
            $ref: '#/components/schemas/apiRoadBlockageDetectionApiElement'
        traffic_signs:
          title: Traffic Sign detection details
          type: array
          description: Nexar traffic sign detection details
          items:
            $ref: '#/components/schemas/apiTrafficSignDetectionApiElement'
        construction_zone_elements:
          title: Construction Zone Element detection details
          type: array
          description: Nexar construction zone element detection details
          items:
            $ref: '#/components/schemas/apiConstructionZoneDetectionApiElement'
        camera_gps:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        frame:
          $ref: '#/components/schemas/apiDetectionEvidenceFrameApiElement'
        osm_segment:
          $ref: '#/components/schemas/apiOsmRoadSegmentApiElement'
        h3_indices:
          $ref: '#/components/schemas/apiH3IndicesApiElement'
        status:
          $ref: '#/components/schemas/apiDetectionStatusApiElementStatus'
    apiHexsegDetectionPayload:
      title: Realtime Detections
      required:
        - detections
      type: object
      properties:
        detections:
          title: Detections
          type: array
          description: A list of detections
          items:
            $ref: '#/components/schemas/apiHexsegDetectionApiElement'
      example:
        detections:
          - detection_count: 14
            negative_detection_count: 2
            first_detection_millis: 1663401980387
            latest_detection_millis: 1663597804506
            construction_zone_elements:
              - confidence: 0.86949587
                bounding_box:
                  x1: 664.625
                  y1: 382.92188
                  x2: 698.375
                  y2: 438.07812
                location:
                  longitude: 40.681501
                  latitude: -73.9666176
                sub_type: CONE
            camera_gps:
              latitude: 40.7380653
              longitude: -73.9800164
              course: 6.91280832
            frame:
              image_id: 4sf05555053d8412db18f81
              image_url: https://example.getnexar.com/c138656055/fod_4117-B25D.jpg
            osm_segment:
              source_id: string
              dest_id: string
              source_location:
                latitude: 40.7380653
                longitude: -73.9800164
              dest_location:
                latitude: 40.7380653
                longitude: -73.9800164
              type: MOTORWAY
            h3_indices:
              res_10: 622236723563233300
              res_12: 631243922817955300
            status: EXISTING
    apiOsmRoadSegmentApiElement:
      title: OSM road segment
      required:
        - dest_id
        - dest_location
        - source_id
        - source_location
      type: object
      properties:
        source_id:
          title: Source Id
          type: integer
          description: OSM node id at the start of this segment
          format: uint64
        dest_id:
          title: Dest Id
          type: integer
          description: OSM node id at the end of this segment
          format: uint64
        source_location:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        dest_location:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        type:
          $ref: '#/components/schemas/apiOsmRoadTypeApiElement'
    apiOsmRoadTypeApiElement:
      title: Open Street Map road types
      type: string
      default: UNKNOWN_ROAD_TYPE
      enum:
        - UNKNOWN_ROAD_TYPE
        - MOTORWAY
        - TRUNK
        - PRIMARY
        - SECONDARY
        - TERTIARY
        - UNCLASSIFIED
        - RESIDENTIAL
        - SERVICE
        - MOTORWAY_LINK
        - TRUNK_LINK
        - PRIMARY_LINK
        - SECONDARY_LINK
        - TERTIARY_LINK
        - LIVING_STREET
        - PEDESTRIAN
        - TRACK
        - BUS_GUIDEWAY
        - ESCAPE
        - RACEWAY
        - ROAD
        - FOOTWAY
        - BRIDLEWAY
        - STEPS
        - PATH
        - CYCLEWAY
        - CONSTRUCTION
        - ABANDONED
        - ACCESS
        - PROPOSED
        - REST_AREA
    apiPixelBoundingBoxApiElement:
      title: Pixel Bounding Box
      required:
        - x1
        - x2
        - y1
        - y2
      type: object
      properties:
        x1:
          title: X1
          type: number
          description: starting x coordinate
          format: float
        y1:
          title: Y1
          type: number
          description: starting y coordinate
          format: float
        x2:
          title: X2
          type: number
          description: ending x coordinate
          format: float
        y2:
          title: Y2
          type: number
          description: ending y coordinate
          format: float
    apiRoadBlockageApiElementSubType:
      title: Road Blockage Detection Sub Type
      type: string
      description: Sub types of road blockage detections (or ANY to include the entire
        type)
      default: UNSET
      enum:
        - UNSET
        - BLOCKING
        - NON_BLOCKING
        - ANY
    apiRoadBlockageDetectionApiElement:
      title: Road Blockage Detection
      required:
        - confidence
        - sub_type
      type: object
      properties:
        confidence:
          title: Confidence
          type: number
          description: A score between 0 and 1 depicting the accuracy of this detection
          format: float
        bounding_box:
          $ref: '#/components/schemas/apiPixelBoundingBoxApiElement'
        location:
          $ref: '#/components/schemas/apiGeoLocationApiElement'
        sub_type:
          $ref: '#/components/schemas/apiRoadBlockageApiElementSubType'
    apiTrafficSignApiElementSubType:
      title: Traffic Sign Detection sub type
      type: string
      description: Sub types of traffic sign detections (or ANY to include the entire
        type)
      default: UNKNOWN
      enum:
        - UNKNOWN
        - STOP
        - SPEED
        - SCHOOL
        - PEDESTRIAN
        - NO_ENTER
        - NO_RIGHT_TURN
        - NO_LEFT_TURN
        - NO_U_TURN
        - PARKING_ZONE
        - YIELD
        - ISR_STOP_SIGN
