    mobinexarConstructionZoneDetection:
      title: Aggregated construction zone detections segmented by geographical shape
      type: object
      properties:
        primary_segments:
          title: Primary Segments
          type: array
          description: Primary segments are road areas which are blocked by construction
            zone
          items:
            $ref: '#/components/schemas/nexarConstructionZoneRoadSegment'
        detection_segments:
          title: Detection Segments
          type: array
          description: Detection segments are where construction zone elements (such
            as Barrels, Traffic cone, etc) were detected.
          items:
            $ref: '#/components/schemas/nexarConstructionZoneDetectionSegment'
    mobinexarConstructionZoneSegment:
      type: object
      properties:
        line:
          $ref: '#/components/schemas/nexarGeoLine'
        lane_impact:
          $ref: '#/components/schemas/nexarConstructionZoneImpactLaneImpact'
      description: Construction zones are segmented geographically. Each segment is
        described by a geographical line.
    mobinexarOperator:
      title: Allowed TimestampParams filter operators
      type: string
      description: Operator
      default: OPERATOR_UNKNOWN
      enum:
        - OPERATOR_UNKNOWN
        - LESS_THAN
        - GREATER_THAN
        - EQUALS
    mobinexarTimeRange:
      title: Work Zones filter by their detection time
      description: Selects detections within the aggregation time window which delimited by the end timestamp 
      type: object
      required:
        - end
      properties:
        start:
          title: Deprecated
          type: string
          format: uint64
        end:
          title: Time range end date (UTC)
          type: string
          format: uint64
      example:
        start: 1585468974791
        end: 1588060974791
    nexarBBox:
      title: Location of detected element on the image, where (X1,Y1),(X2,Y2) describes
        the SW,NE corners accordingly
      type: object
      properties:
        x1:
          type: number
          format: double
        y1:
          type: number
          format: double
        x2:
          type: number
          format: double
        y2:
          type: number
          format: double
        tag:
          type: string
      example:
        x1: 246
        y1: 426
        x2: 290
        y2: 492
        tag: grabber_cone
    nexarBoundingGPSBox:
      title: Geo bounding box
      required:
        - north_east_point
        - south_west_point
