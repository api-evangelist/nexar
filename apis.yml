apis:
- aid: nexar:virtualcam
  name: CityStream VirtualCam API
  description: Returns a fresh collection of anonymized road frames captured by the Nexar camera network,
    selectable by date, location, minimum quality, road type, time of day or vehicle heading, plus an
    H3 coverage endpoint for checking imagery availability across an area.
  humanURL: https://developer.getnexar.com/documentation
  baseURL: https://external.getnexar.com
  tags:
  - Mapping
  - Geospatial
  - Transportation
  - Computer Vision
  - Imagery
  - Road Data
  properties:
  - type: OpenAPI
    url: openapi/nexar-virtualcam-openapi.yml
  - type: Overlay
    url: overlays/nexar-virtualcam-overlay.yaml
  version: '4.0'
- aid: nexar:livefeed
  name: CityStream Live Feed API
  description: Returns real-time detections produced by the Nexar camera network. The endpoint is generic
    across detection types (construction zones, road conditions, road surface, traffic signs) and can
    be served as JSON, GeoJSON (application/geo+json) or a WZDx feed (application/vnd.wzdx).
  humanURL: https://developer.getnexar.com/documentation
  baseURL: https://external.getnexar.com
  tags:
  - Mapping
  - Geospatial
  - Transportation
  - Computer Vision
  - Imagery
  - Road Data
  properties:
  - type: OpenAPI
    url: openapi/nexar-livefeed-openapi.yml
  - type: Overlay
    url: overlays/nexar-livefeed-overlay.yaml
  version: '4.0'
- aid: nexar:workzones
  name: CityStream Work Zones API
  description: Returns a curated collection of work zones that Nexar AI detects from road imagery containing
    work-zone elements such as grabber cones, diamond signs, barriers and message boards, with a companion
    endpoint for the full detail of a single work zone.
  humanURL: https://developer.getnexar.com/documentation
  baseURL: https://external.getnexar.com
  tags:
  - Mapping
  - Geospatial
  - Transportation
  - Computer Vision
  - Imagery
  - Road Data
  properties:
  - type: OpenAPI
    url: openapi/nexar-workzones-openapi.yml
  - type: Overlay
    url: overlays/nexar-workzones-overlay.yaml
  version: '3.0'
- aid: nexar:roadinventory
  name: CityStream Road Inventory API
  description: Returns a curated inventory of road signs and road assets captured by the Nexar camera
    network, with a companion endpoint for the full detail of a single detection.
  humanURL: https://developer.getnexar.com/documentation
  baseURL: https://external.getnexar.com
  tags:
