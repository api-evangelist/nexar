aid: nexar
name: Nexar
description: 'Nexar is a physical-AI infrastructure company that operates one of the largest real-world
  video driving datasets — over 1.2 billion miles of driving captured each year by more than 350,000 connected
  dashcams — and turns it into training data, collision-prediction models and real-time road intelligence
  for autonomous-vehicle, ADAS, mapping and smart-city programs. Its developer-facing surface is the CityStream™
  family of REST APIs, published as four OpenAPI 3.0.1 contracts on the Nexar Developers Portal: VirtualCam
  (anonymized road frames), Live Feed (real-time detections), Work Zones (curated construction-zone detections,
  served as WZDx and GeoJSON) and Road Inventory (curated traffic-sign and road-asset detections). All
  four run on a single gRPC-gateway backed host and are authorized with a bearer access token minted through
  Nexar''s Okta authorization server. Nexar also publishes the open-source BADAS collision-prediction
  model on PyPI and the `nap` platform CLI through its own Homebrew tap.'
